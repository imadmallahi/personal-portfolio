<section id="contact" class="contact-section">
    <div class="container">
        <h2 class="section-title fade-in">{{ t().contact.title }}</h2>

        <div class="contact-content fade-in" style="animation-delay: 0.2s">
            <p class="contact-text">
                {{ t().contact.description }}
            </p>

            <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
                <div class="form-group">
                    <label for="name">{{ t().contact.name }}</label>
                    <input type="text" id="name" formControlName="name" [placeholder]="t().contact.namePlaceholder"
                        required>
                </div>

                <div class="form-group">
                    <label for="subject">{{ t().contact.subject }}</label>
                    <input type="text" id="subject" formControlName="subject"
                        [placeholder]="t().contact.subjectPlaceholder" required>
                </div>

                <div class="form-group">
                    <label for="message">{{ t().contact.message }}</label>
                    <textarea id="message" formControlName="message" rows="5"
                        [placeholder]="t().contact.messagePlaceholder" required></textarea>
                </div>

                <button type="submit" class="submit-btn" [disabled]="!contactForm.valid">
                    {{ t().contact.sendMessage }}
                </button>
            </form>

            <div class="social-links">
                <a [href]="contact().github" target="_blank" rel="noopener noreferrer" class="social-link">
                    GitHub
                </a>
                <a [href]="contact().linkedin" target="_blank" rel="noopener noreferrer" class="social-link">
                    LinkedIn
                </a>
            </div>
        </div>
    </div>
</section>
