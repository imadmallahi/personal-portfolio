<section id="skills" class="skills-section">
    <div class="container">
        <h2 class="section-title fade-in">{{ currentLang() === 'en' ? 'Skills' : 'Compétences' }}</h2>

        <div class="skills-grid">
            <div class="skill-category fade-in" *ngFor="let category of skills(); let i = index"
                [style.animation-delay.s]="0.1 * i">
                <h3 class="category-name">{{ category.name }}</h3>
                <div class="skill-tags">
                    <span class="skill-tag" *ngFor="let skill of category.skills">{{ skill }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
