<section id="education" class="education-section">
    <div class="container">
        <h2 class="section-title fade-in">{{ currentLang() === 'en' ? 'Education' : 'Formation' }}</h2>

        <div class="education-grid">
            <div class="edu-card fade-in" *ngFor="let edu of education(); let i = index"
                [style.animation-delay.s]="0.2 * i">
                <div class="card-header">
                    <span class="year">{{ edu.period }}</span>
                    <span class="icon">🎓</span>
                </div>
                <h3 class="degree">{{ edu.degree }}</h3>
                <p class="institution">{{ edu.institution }}</p>
                <p class="location">{{ edu.location }}</p>
            </div>
        </div>
    </div>
</section>
